services:
  - type: web
    name: fire-beats
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: PUBLIC_URL
        fromService:
          type: web
          name: fire-beats
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
