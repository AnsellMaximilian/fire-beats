name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tag
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read release version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_name="${GITHUB_REF_NAME#v}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch + 100))

          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "apk=dist/fire-beats.apk" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/fire-beats.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        shell: bash
        env:
          FIREBEATS_KEYSTORE_BASE64: ${{ secrets.FIREBEATS_KEYSTORE_BASE64 }}
          FIREBEATS_KEYSTORE_PASSWORD: ${{ secrets.FIREBEATS_KEYSTORE_PASSWORD }}
          FIREBEATS_KEY_ALIAS: ${{ secrets.FIREBEATS_KEY_ALIAS }}
          FIREBEATS_KEY_PASSWORD: ${{ secrets.FIREBEATS_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            FIREBEATS_KEYSTORE_BASE64 \
            FIREBEATS_KEYSTORE_PASSWORD \
            FIREBEATS_KEY_ALIAS \
            FIREBEATS_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/fire-beats-release.jks"
          printf '%s' "$FIREBEATS_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "FIREBEATS_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        env:
          FIREBEATS_KEYSTORE_PASSWORD: ${{ secrets.FIREBEATS_KEYSTORE_PASSWORD }}
          FIREBEATS_KEY_ALIAS: ${{ secrets.FIREBEATS_KEY_ALIAS }}
          FIREBEATS_KEY_PASSWORD: ${{ secrets.FIREBEATS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            -PFIREBEATS_VERSION_NAME="${{ steps.version.outputs.name }}" \
            -PFIREBEATS_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Prepare and verify release assets
        id: assets
        shell: bash
        run: |
          source_apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$source_apk" ]]; then
            echo "::error::Signed release APK was not produced at $source_apk"
            exit 1
          fi

          mkdir -p dist
          install -m 0644 "$source_apk" "${{ steps.version.outputs.apk }}"
          apk_name="$(basename "${{ steps.version.outputs.apk }}")"
          (
            cd dist
            sha256sum "$apk_name" > "$apk_name.sha256"
          )

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Could not find apksigner in the Android SDK"
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "${{ steps.version.outputs.apk }}"

      - name: Retain workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: fire-beats-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${{ steps.version.outputs.apk }}" \
              "${{ steps.version.outputs.checksum }}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.version.outputs.apk }}" \
              "${{ steps.version.outputs.checksum }}" \
              --generate-notes \
              --title "Fire Beats ${{ steps.version.outputs.name }}" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
